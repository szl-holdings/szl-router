[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-router"
version = "1.1.0"
description = "Sovereign, OpenAI-compatible LLM gateway with a receipt on every answer; signed when a key is armed, else UNSIGNED-honest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.28",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# szl-receipt-dsse (import name szl_receipt) is published on PyPI; signing is an OPT-IN extra. Install:
#   pip install "szl-receipt-dsse>=0.3.1"   (PyPI dist; the import name stays szl_receipt)
# Keyless (extra not installed) stays UNSIGNED-honest — never a fabricated signature.
# szl_router/receipts.py also imports cryptography directly (_derive_public_pem), so the
# extra lists it instead of relying on szl-receipt-dsse to bring it in.
sign = ["szl-receipt-dsse>=0.3.1", "cryptography>=42.0.0"]
# Hugging Face publishers: scripts/hf_space_bootstrap.py, scripts/hf_space_deploy.py and
# scripts/router_control_space.py (the deploy workflows pin huggingface_hub==1.10.1).
hf-publish = ["huggingface-hub>=1.10.1"]
# test_local_demo.py and test_router_control_space.py import szl_receipt and huggingface_hub
# at module scope, so test repeats sign and hf-publish. tests/test_dependency_contract.py
# maps every import to these groups; the floors added here are the lowest versions tested.
test = [
  "pytest",
  "httpx",
  "szl-receipt-dsse>=0.3.1",
  "cryptography>=42.0.0",
  "huggingface-hub>=1.10.1",
]

[project.scripts]
szl-router = "szl_router.app:main"
szl-router-verify = "szl_router.verify:main"
szl-router-control-verify = "router_control.verification:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-router"
Source = "https://github.com/szl-holdings/szl-router"
Issues = "https://github.com/szl-holdings/szl-router/issues"
Changelog = "https://github.com/szl-holdings/szl-router/releases"

[tool.setuptools]
packages = ["szl_router", "router_control"]

[tool.setuptools.package-data]
router_control = [
  "static/*.html", "static/*.js", "static/*.css",
  "static/szl/szl-tokens.css", "static/szl/szl-icon-32.svg",
  "static/szl/SOURCE.json", "static/szl/PROJECTION.json",
]

[tool.szl.release]
import_names = ["router_control", "szl_router"] # wheel top-level import names; the release gate fails if the built wheel differs
