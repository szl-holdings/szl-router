name: Deploy SZL Router flagship Space

# GitHub is the source authority. This single writer restores and publishes only
# the existing SZLHOLDINGS/llm-router-live Space. It never creates another Space
# and never publishes provider credentials or gateway runtime configuration.
on:
  push:
    branches: [main]
    paths:
      - "space/**"
      - ".github/workflows/hf-space-deploy.yml"
      - "scripts/hf_space_deploy.py"
      - "scripts/hf_space_drift_check.py"

permissions:
  contents: read

concurrency:
  group: szl-router-flagship-publication
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish, restore, and prove exact router Space
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      HF_SPACE_REPO_ID: SZLHOLDINGS/llm-router-live
      HF_SPACE_ENDPOINT: https://szlholdings-llm-router-live.hf.space
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Verify exact checkout and source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile \
            scripts/hf_space_deploy.py \
            scripts/hf_space_drift_check.py \
            space/server.py \
            space/szl_source_attestation.py
          python -m unittest discover -s space/tests -p 'test_*.py'
          git diff --check

      - name: Install exact Hub client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "huggingface_hub==1.10.1"

      - name: Publish existing Space, restore public visibility, and restart
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python scripts/hf_space_deploy.py \
            --repo-id "$HF_SPACE_REPO_ID" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --token "$HF_TOKEN" \
            > router-flagship-publication.json

      - name: Verify publication, deployment, runtime, and source parity
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hf_space_drift_check.py \
            --repo-id "$HF_SPACE_REPO_ID" \
            --endpoint "$HF_SPACE_ENDPOINT" \
            --source-revision "$GITHUB_SHA" \
            --token "$HF_TOKEN" \
            --evidence-file hf-space-parity-evidence.json \
            --witness-timeout-seconds 900 \
            --poll-interval-seconds 10 \
            --request-timeout-seconds 15

      - name: Preserve immutable flagship publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szl-router-flagship-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            router-flagship-publication.json
            hf-space-parity-evidence.json
          if-no-files-found: warn
          retention-days: 90
