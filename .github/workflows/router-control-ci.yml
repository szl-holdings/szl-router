name: SZL Sovereign Router CI

on:
  pull_request:
    branches: [main]
    paths:
      - "router_control/**"
      - "tests/test_router_control.py"
      - "requirements-router-control*.txt"
      - "Dockerfile.router-control"
      - ".github/workflows/router-control-ci.yml"
      - "docs/ROUTER_CONTROL.md"
  push:
    branches: [main]
    paths:
      - "router_control/**"
      - "tests/test_router_control.py"
      - "requirements-router-control*.txt"
      - "Dockerfile.router-control"
      - ".github/workflows/router-control-ci.yml"
      - "docs/ROUTER_CONTROL.md"

permissions:
  contents: read

concurrency:
  group: szl-router-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: router/source-native
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-router-control-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-router-control-dev.txt

      - name: Compile and test routing contracts
        run: |
          python -I -P -m py_compile router_control/app.py
          python -m pytest -q tests/test_router_control.py

      - name: Prove egress and frontend authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("router_control")
          source = (root / "app.py").read_text(encoding="utf-8")
          html = (root / "static/index.html").read_text(encoding="utf-8")
          js = (root / "static/app.js").read_text(encoding="utf-8")
          css = (root / "static/styles.css").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/router-control-ci.yml").read_text(encoding="utf-8")

          required_source = (
              'SZL_ROUTER_ENABLE_EGRESS',
              'SZL_ROUTER_ALLOWED_HOSTS',
              'SZL_ROUTER_PROVIDERS_JSON',
              'follow_redirects=False',
              'trust_env=False',
              'parsed.scheme != "https"',
              'host not in allowed_hosts',
              'literal IP provider hosts are forbidden',
              'streaming is unavailable in receipt-verified v1',
              '"secret_material_recorded": False',
          )
          missing = [item for item in required_source if item not in source]
          if missing:
              raise SystemExit(f"missing router authority contract: {missing}")

          forbidden_source = (
              "subprocess",
              "os.system",
              "eval(",
              "exec(",
              "requests.",
              "urllib.request.urlopen",
              "follow_redirects=True",
              "trust_env=True",
          )
          present = [item for item in forbidden_source if item in source]
          if present:
              raise SystemExit(f"forbidden router capability: {present}")

          forbidden_frontend = (
              "https://",
              "http://",
              "localStorage",
              "sessionStorage",
              "document.cookie",
              "WebSocket(",
              "EventSource(",
              "eval(",
          )
          present = [item for item in forbidden_frontend if item in html or item in js]
          if present:
              raise SystemExit(f"forbidden frontend capability: {present}")

          required_css = (
              "prefers-reduced-motion",
              "prefers-contrast",
              "forced-colors",
              "@media print",
          )
          missing = [item for item in required_css if item not in css]
          if missing:
              raise SystemExit(f"missing adaptive contract: {missing}")

          uses = re.findall(r"^\s*uses:\s*(\S+)\s*(?:#.*)?$", workflow, re.MULTILINE)
          unpinned = [item for item in uses if not re.fullmatch(r"[^@\s]+@[0-9a-f]{40}", item)]
          if unpinned:
              raise SystemExit(f"unpinned actions: {unpinned}")
          print("router authority boundary: PASS")
          PY

      - name: Verify patch hygiene
        run: git diff --check

  container:
    name: router/non-root-default-deny-container
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build image
        run: docker build --file Dockerfile.router-control --tag szl-router:${{ github.sha }} .

      - name: Verify non-root and default-deny declarations
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect szl-router:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect szl-router:${{ github.sha }} --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^SZL_ROUTER_ENABLE_EGRESS=')" = "SZL_ROUTER_ENABLE_EGRESS=0"
