name: SZL Sovereign Router CI

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "router_control/**"
      - "space/**"
      - "scripts/test_native_frontends_browser.cjs"
      - "tests/test_native_frontend_assets.py"
      - "demo/CONTRACT.md"
      - "demo/__init__.py"
      - "demo/fixture_app.py"
      - "demo/run_contract_demo.py"
      - "tests/test_router_control.py"
      - "tests/test_router_verification.py"
      - "tests/test_router_frontend.py"
      - "pyproject.toml"
      - "scripts/check_control_package.py"
      - "scripts/check_router_control_image.py"
      - "requirements-router-control*.txt"
      - "Dockerfile.router-control"
      - ".github/workflows/router-control-ci.yml"
      - ".github/workflows/publish-router-control.yml"
      - "docs/ROUTER_CONTROL.md"
  push:
    branches: [main]
    paths:
      - "router_control/**"
      - "space/**"
      - "scripts/test_native_frontends_browser.cjs"
      - "tests/test_native_frontend_assets.py"
      - "demo/CONTRACT.md"
      - "demo/__init__.py"
      - "demo/fixture_app.py"
      - "demo/run_contract_demo.py"
      - "tests/test_router_control.py"
      - "tests/test_router_verification.py"
      - "tests/test_router_frontend.py"
      - "pyproject.toml"
      - "scripts/check_control_package.py"
      - "scripts/check_router_control_image.py"
      - "requirements-router-control*.txt"
      - "Dockerfile.router-control"
      - ".github/workflows/router-control-ci.yml"
      - ".github/workflows/publish-router-control.yml"
      - "docs/ROUTER_CONTROL.md"

permissions:
  contents: read

concurrency:
  group: szl-router-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: router/source-native
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-router-control-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-router-control-dev.txt

      - name: Compile and test routing contracts
        run: |
          python -I -P -m py_compile router_control/app.py router_control/local_store.py
          python -m pytest -q tests/test_router_control.py tests/test_router_local_store.py tests/test_router_verification.py tests/test_router_frontend.py

      - name: Qualify installed wheel away from source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/router-wheel" .
          python scripts/check_control_package.py "$RUNNER_TEMP"/router-wheel/szl_router-*.whl

      - name: Exercise synthetic HTTP contract and offline verifier
        run: python -m demo.run_contract_demo --output contract-report.json

      - name: Preserve synthetic contract evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-synthetic-contract-${{ github.sha }}
          path: contract-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove egress and frontend authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("router_control")
          source = (root / "app.py").read_text(encoding="utf-8")
          html = (root / "static/index.html").read_text(encoding="utf-8")
          js = (root / "static/app.js").read_text(encoding="utf-8")
          css = (root / "static/styles.css").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/router-control-ci.yml").read_text(encoding="utf-8")

          required_source = (
              'SZL_ROUTER_ENABLE_EGRESS',
              'SZL_ROUTER_ALLOWED_HOSTS',
              'SZL_ROUTER_PROVIDERS_JSON',
              'follow_redirects=False',
              'trust_env=False',
              'parsed.scheme != "https"',
              'host not in allowed_hosts',
              'literal IP provider hosts are forbidden',
              'streaming is unavailable in receipt-verified v1',
              '"secret_material_recorded": False',
          )
          missing = [item for item in required_source if item not in source]
          if missing:
              raise SystemExit(f"missing router authority contract: {missing}")

          forbidden_source = (
              "subprocess",
              "os.system",
              "eval(",
              "exec(",
              "requests.",
              "urllib.request.urlopen",
              "follow_redirects=True",
              "trust_env=True",
          )
          present = [item for item in forbidden_source if item in source]
          if present:
              raise SystemExit(f"forbidden router capability: {present}")

          forbidden_frontend = (
              "https://",
              "http://",
              "localStorage",
              "sessionStorage",
              "document.cookie",
              "WebSocket(",
              "EventSource(",
              "eval(",
          )
          present = [item for item in forbidden_frontend if item in html or item in js]
          if present:
              raise SystemExit(f"forbidden frontend capability: {present}")

          required_css = (
              "prefers-reduced-motion",
              "prefers-contrast",
              "forced-colors",
              "@media print",
          )
          missing = [item for item in required_css if item not in css]
          if missing:
              raise SystemExit(f"missing adaptive contract: {missing}")

          uses = re.findall(r"^\s*uses:\s*(\S+)\s*(?:#.*)?$", workflow, re.MULTILINE)
          unpinned = [item for item in uses if not re.fullmatch(r"[^@\s]+@[0-9a-f]{40}", item)]
          if unpinned:
              raise SystemExit(f"unpinned actions: {unpinned}")
          print("router authority boundary: PASS")
          PY

      - name: Verify patch hygiene
        run: git diff --check

  container:
    name: router/non-root-default-deny-container
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build image
        run: docker build --file Dockerfile.router-control --build-arg SOURCE_REVISION=${{ github.sha }} --tag szl-router:${{ github.sha }} .

      - name: Verify non-root and default-deny declarations
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect szl-router:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect szl-router:${{ github.sha }} --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^SZL_ROUTER_ENABLE_EGRESS=')" = "SZL_ROUTER_ENABLE_EGRESS=0"

      - name: Exercise running container without network access
        run: python scripts/check_router_control_image.py --image szl-router:${{ github.sha }} --source-revision ${{ github.sha }}

  browser:
    name: router/native-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Set up browser Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Qualify native source and install isolated browser harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m pip install --requirement requirements-router-control-dev.txt
          python -m pytest -q tests/test_native_frontend_assets.py
          npm install --prefix "$RUNNER_TEMP/router-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/router-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise both native frontends with synthetic providers
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/router-browser/node_modules" \
          ROUTER_BROWSER_EVIDENCE="$RUNNER_TEMP/router-browser-evidence" \
          node scripts/test_native_frontends_browser.cjs
      - name: Preserve unsigned local-source browser observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-native-browser-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/router-browser-evidence
          if-no-files-found: warn
          retention-days: 14
