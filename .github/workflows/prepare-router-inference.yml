name: Prepare disabled inference bundle

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/router_inference_bundle.py"
      - "test_router_inference_bundle.py"
      - "test_router_inference_workflow.py"
      - "router_control/**"
      - "docs/INFERENCE_STAGING.md"
      - ".github/workflows/prepare-router-inference.yml"
  push:
    branches: [main]
    paths:
      - "scripts/router_inference_bundle.py"
      - "test_router_inference_bundle.py"
      - "test_router_inference_workflow.py"
      - "router_control/**"
      - "docs/INFERENCE_STAGING.md"
      - ".github/workflows/prepare-router-inference.yml"
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact digest published from this main commit; preparation only
        required: true
        type: string

permissions: {}

concurrency:
  group: inference-bundle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: router/inference-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Test offline bundle and workflow contracts
        run: |
          python -m pip install --requirement requirements-router-control-dev.txt
          python -B -m unittest -v test_router_inference_bundle test_router_inference_workflow
          git diff --check

  prepare:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.repository == 'szl-holdings/szl-router' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      CONTROL_IMAGE: ghcr.io/szl-holdings/szl-router-control
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Admit source and immutable image
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = szl-holdings/szl-router
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git ls-remote https://github.com/szl-holdings/szl-router.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/inference-evidence"
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install pinned bundle dependencies
        run: python -m pip install --requirement requirements-router-control.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify exact image signature and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$CONTROL_IMAGE@$IMAGE_DIGEST"
          cosign verify \
            --certificate-identity 'https://github.com/szl-holdings/szl-router/.github/workflows/publish-router-control.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image_ref" > "$RUNNER_TEMP/inference-evidence/cosign-verification.json"
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --signer-repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/inference-evidence/provenance-verification.json"
      - name: Prepare immutable disabled bundle
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/router_inference_bundle.py \
            --source-revision "$GITHUB_SHA" \
            --image-reference "$CONTROL_IMAGE@$IMAGE_DIGEST" \
            --output "$RUNNER_TEMP/inference-evidence/bundle"
      - name: Exercise staged image without network access
        shell: bash
        run: |
          set -euo pipefail
          docker build --file "$RUNNER_TEMP/inference-evidence/bundle/Dockerfile" \
            --tag szl-router-inference:staged "$RUNNER_TEMP/inference-evidence/bundle"
          python scripts/check_router_control_image.py \
            --image szl-router-inference:staged --source-revision "$GITHUB_SHA" \
            > "$RUNNER_TEMP/inference-evidence/container-readback.json"
          test "$(git ls-remote https://github.com/szl-holdings/szl-router.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Retain preparation evidence, including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-inference-disabled-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inference-evidence/
          if-no-files-found: warn
          retention-days: 90
