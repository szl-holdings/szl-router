name: Publish router control image

# Owner dispatch from protected main only. This publishes a separate control
# gateway image; the legacy szl-router image and public Hub Space are untouched.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: router-control-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  admit:
    name: Require protected main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject other repositories and refs
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "szl-holdings/szl-router"
          test "$GITHUB_REF" = "refs/heads/main"

  publish:
    needs: admit
    if: github.repository == 'szl-holdings/szl-router' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      CONTROL_IMAGE: ghcr.io/szl-holdings/szl-router-control
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout selected protected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source selection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "szl-holdings/szl-router"

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-router-control-dev.txt

      - name: Qualify source and offline HTTP contract
        run: |
          python -m pip install --requirement requirements-router-control-dev.txt
          python -m pytest -q tests/test_router_control.py tests/test_router_local_store.py tests/test_router_verification.py tests/test_router_frontend.py
          python -m demo.run_contract_demo --output contract-report.json

      - name: Build and exercise the control image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file Dockerfile.router-control \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --tag "szl-router-control:candidate" .
          python scripts/check_router_control_image.py \
            --image szl-router-control:candidate --source-revision "$GITHUB_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and read back registry digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image_tag="$CONTROL_IMAGE:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          docker tag szl-router-control:candidate "$image_tag"
          remote_main="$(git ls-remote https://github.com/szl-holdings/szl-router.git refs/heads/main | cut -f1)"
          test "$remote_main" = "$GITHUB_SHA"
          docker push "$image_tag" | tee "$RUNNER_TEMP/router-control-push.log"
          digest="$(python - "$RUNNER_TEMP/router-control-push.log" <<'PY'
          import pathlib
          import re
          import sys

          log = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          matches = re.findall(r"\bdigest: (sha256:[0-9a-f]{64})\b", log)
          if len(matches) != 1:
              raise SystemExit("registry push did not emit one manifest digest")
          print(matches[0])
          PY
          )"
          docker pull "$CONTROL_IMAGE@$digest"
          python scripts/check_router_control_image.py \
            --image "$CONTROL_IMAGE@$digest" --source-revision "$GITHUB_SHA"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Attest the exact registry digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CONTROL_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and independently verify the exact digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$CONTROL_IMAGE@${{ steps.publish.outputs.digest }}"
          cosign sign --yes "$image_ref"
          cosign verify \
            --certificate-identity 'https://github.com/szl-holdings/szl-router/.github/workflows/publish-router-control.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image_ref" > cosign-verification.json
          gh attestation verify "oci://$image_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --signer-repo "$GITHUB_REPOSITORY" \
            --deny-self-hosted-runners \
            --format json > provenance-verification.json

      - name: Record current-source publication result
        shell: bash
        run: |
          set -euo pipefail
          remote_main_after="$(git ls-remote https://github.com/szl-holdings/szl-router.git refs/heads/main | cut -f1)"
          IMAGE_TAG='${{ steps.publish.outputs.tag }}' \
          IMAGE_DIGEST='${{ steps.publish.outputs.digest }}' \
          REMOTE_MAIN_AFTER="$remote_main_after" python - <<'PY'
          import json
          import os
          from pathlib import Path

          current = os.environ["REMOTE_MAIN_AFTER"] == os.environ["GITHUB_SHA"]
          receipt = {
              "schema": "szl.router-control-image-publication/v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "main_at_receipt": os.environ["REMOTE_MAIN_AFTER"],
              "source_current_at_receipt": current,
              "publication_status": "PUBLISHED_CURRENT" if current else "PUBLISHED_SUPERSEDED",
              "image_tag": os.environ["IMAGE_TAG"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "image_reference": os.environ["CONTROL_IMAGE"] + "@" + os.environ["IMAGE_DIGEST"],
              "source_tests": "PASS",
              "offline_container_smoke": "PASS",
              "registry_digest_readback": "PASS",
              "build_provenance": "VERIFIED",
              "cosign_signature": "VERIFIED",
              "production_host": "UNVERIFIED",
              "provider_inference": "UNVERIFIED",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path("router-control-image-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
          test "$remote_main_after" = "$GITHUB_SHA"

      - name: Preserve publication receipt
        if: ${{ always() && hashFiles('router-control-image-receipt.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-control-image-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            router-control-image-receipt.json
            cosign-verification.json
            provenance-verification.json
          if-no-files-found: error
          retention-days: 30
